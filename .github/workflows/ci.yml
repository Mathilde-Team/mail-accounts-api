# CI du socle Mathilde-Team. Le job « Qualité (lint, tests) » est un check
# requis sur main et dev (.github/branch-protection/*.json) : garder son nom.
name: CI

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Qualité (lint, tests)
    runs-on: ${{ fromJSON(vars.RUNS_ON_LINUX || '{"group":"maison","labels":["self-hosted","linux"]}') }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v7

      - name: Installation de uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Installation de Python
        run: uv python install

      - name: Lint YAML (yamllint --strict)
        run: uvx yamllint==1.38.0 --strict -c .yamllint.yaml .

      - name: Lint Python (ruff)
        run: uv run ruff check . && uv run ruff format --check .

      - name: Syntaxe des scripts Python
        run: uv run --no-project python -m py_compile scripts/*.py

      # Tests et couverture (SOCLE.md §4) : seuil bloquant déclaré une seule
      # fois dans pyproject.toml ([tool.coverage.report] fail_under) ; la
      # commande ne recopie aucune valeur.
      - name: Tests et couverture (seuil lu dans pyproject.toml)
        run: make test
